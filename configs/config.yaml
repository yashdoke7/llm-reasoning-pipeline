provider: groq
ollama:
  host: http://localhost:11434
  timeout: 300
openai:
  timeout: 60
project:
  name: llm-reasoning-eval
  version: 1.0.0
  description: Step-level LLM reasoning evaluation and targeted LoRA fine-tuning
api:
  groq_api_key_env: GROQ_API_KEY
  groq_api_key_envs:
  - GROQ_API_KEY
  - GROQ_API_KEY_2
  - GROQ_API_KEY_3
  - GROQ_API_KEY_4
  openai_api_key_env: OPENAI_API_KEY
  wandb_api_key_env: WANDB_API_KEY
  wandb_project: llm-reasoning-eval
  wandb_entity: null
models:
  eval_models:
  - id: llama-3.1-8b-instant
    display_name: Llama-3.1-8B
    provider: groq
  - id: llama-3.3-70b-versatile
    display_name: Llama-3.3-70B
    provider: groq
  - id: meta-llama/llama-4-scout-17b-16e-instruct
    display_name: Llama-4-Scout
    provider: groq
  evaluator_model: llama-3.3-70b-versatile
  trace_gen_model: llama-3.3-70b-versatile
  local_judge_model: qwen2.5:14b
groq:
  max_retries: 5
  base_delay: 1.0
  max_delay: 60.0
  timeout: 30
  tpm_limit: 14400
  rpm_limit: 30
eval:
  samples_per_category: 50
  max_reasoning_steps: 10
  min_reasoning_steps: 2
  temperature: 0.1
  max_tokens: 1024
  uncertainty_threshold: 0.4
  hallucination_threshold: 0.6
  categories:
  - multistep_arithmetic
  - factual_consistency
  - tool_use_planning
  - causal_counterfactual
datasets:
  gsm8k:
    split: test
    max_samples: 200
    cache_dir: data_loaders/data/gsm8k_cache
  crass:
    path: data_loaders/data/generated_counterfactual.jsonl
    max_samples: 60
  toolbench:
    path: data_loaders/data/generated_tooluse.jsonl
    max_samples: 60
  factual_synthetic:
    path: data_loaders/data/generated_factual.jsonl
    max_samples: 60
    topics:
    - climate_change
    - machine_learning
    - world_war_ii
    - quantum_computing
    - space_exploration
  physics:
    path: data_loaders/data/physics_eval.jsonl
    max_samples: 60
dataset_generation:
  default_provider: ollama
  default_model: qwen2.5:7b
  samples_per_category: 60
mitigation:
  retriever:
    type: wikipedia
    top_k: 3
    max_chars_per_doc: 1500
  regrounder:
    max_regen_attempts: 2
    temperature: 0.05
finetune:
  base_model: Qwen/Qwen2.5-7B-Instruct
  output_dir: outputs/finetuned_model
  dataset_path: data_loaders/data/finetune_dataset.jsonl
  lora:
    r: 16
    lora_alpha: 32
    target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
    lora_dropout: 0.05
    bias: none
  training:
    num_epochs: 2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 0.0001
    warmup_ratio: 0.03
    lr_scheduler_type: cosine
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    max_seq_length: 768
    load_in_4bit: true
    fp16: false
    bf16: true
  quantization:
    output_dir: outputs/quantized
    formats:
    - name: Q4_K_M
      description: 4-bit, best quality/size tradeoff
    - name: Q8_0
      description: 8-bit, near full quality
paths:
  logs: logs
  outputs: outputs
  charts: outputs/charts
  reports: outputs/reports
  eval_results: outputs/eval_results.json
  failure_report: outputs/failure_report.json
logging:
  level: INFO
  format: '%(asctime)s | %(name)s | %(levelname)s | %(message)s'
  file: logs/pipeline.log
